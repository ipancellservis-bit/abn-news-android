
name: ABN Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - 'ABN-News-Android-cloud-build-v1.0.0.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager tidak ditemukan"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Extract Android Project
        run: |
          mkdir -p android-project
          unzip -o ABN-News-Android-cloud-build-v1.0.0.zip -d android-project

      - name: Find Android Project
        run: |
          PROJECT_FILE=$(find android-project -type f -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan: $PROJECT_DIR"

      - name: Build ABN News APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "APK tidak ditemukan"
            exit 1
          fi

          mkdir -p output
          cp "$APK_FILE" output/ABN-News-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABN-News-Android-APK
          path: output/ABN-News-debug.apk
          if-no-files-found: error
